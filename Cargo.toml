[package]
name = "titan-audio-ecosystem"
version = "6.0.0"
edition = "2021"
description = "Adaptive 2D neural-cellular-automata audio ecosystem"
license = "MIT"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1"
bincode = "1"
candle-core = "0.9"
candle-nn = "0.9"
csv = "1"
ctrlc = "3"
hound = "3"
mimalloc = { version = "0.1", default-features = false, optional = true }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "titan"
path = "src/main.rs"
